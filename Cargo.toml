[workspace]
resolver = "3"
members = ["crates/*", "apps/cli", "apps/desktop/src-tauri", "tests/e2e"]
default-members = ["crates/*", "apps/cli", "tests/e2e"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
tokenmtr-app = { path = "crates/tokenmtr-app" }
tokenmtr-brand = { path = "crates/tokenmtr-brand" }
tokenmtr-core = { path = "crates/tokenmtr-core" }
tokenmtr-config = { path = "crates/tokenmtr-config" }
tokenmtr-store = { path = "crates/tokenmtr-store" }
tokenmtr-query = { path = "crates/tokenmtr-query" }
tokenmtr-agents = { path = "crates/tokenmtr-agents" }
tokenmtr-export = { path = "crates/tokenmtr-export" }
tokenmtr-import = { path = "crates/tokenmtr-import" }
tokenmtr-metrics = { path = "crates/tokenmtr-metrics" }
tokenmtr-report = { path = "crates/tokenmtr-report" }
tokenmtr-remote = { path = "crates/tokenmtr-remote" }
tokenmtr-control = { path = "crates/tokenmtr-control" }
tokenmtr-daemon = { path = "crates/tokenmtr-daemon" }
tokenmtr-platform = { path = "crates/tokenmtr-platform" }

anyhow = "1.0"
base64 = "0.23"
blake3 = "1.8"
bytes = "1"
camino = { version = "1.2", features = ["serde1"] }
clap = { version = "4.6", features = ["derive"] }
csv = "1.4"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
globset = "0.4"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server-graceful"] }
gix = { version = "0.89", default-features = false, features = ["max-performance-safe", "sha1"] }
jiff = { version = "0.2", features = ["serde"] }
libc = "0.2"
memchr = "2.8"
notify = "8"
prost = { version = "0.14", default-features = false, features = ["derive"] }
quick-xml = { version = "0.42", features = ["serialize"] }
rayon = "1.12"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
rusqlite_migration = "2.6"
rust_decimal = "1.43"
secrecy = { version = "0.10", features = ["serde"] }
security-framework = "3.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
snap = "1"
subtle = "2.6"
sha2 = "0.11"
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "signal"] }
toml = "1.1"
toml_edit = "0.25"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1.28", features = ["v7", "serde"] }
zstd = "0.14"

# desktop shell (apps/desktop/src-tauri)
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"

# dev
assert_cmd = "2.2"
divan = "0.1"
insta = { version = "1.49", features = ["json"] }
jsonschema = { version = "0.59", default-features = false }
predicates = "3.1"
proptest = "1.12"
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# Optimised dependencies in dev and test builds: unoptimised JSON, SQLite and zstd made every
# daemon start in a test parse the embedded price list slowly enough to time out on CI runners.
# The workspace crates stay unoptimised and debuggable.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
