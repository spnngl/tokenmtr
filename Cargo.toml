[workspace]
resolver = "3"
members = ["crates/*", "apps/cli", "apps/desktop/src-tauri"]
default-members = ["crates/*", "apps/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
tokenmtr-core = { path = "crates/tokenmtr-core" }
tokenmtr-config = { path = "crates/tokenmtr-config" }
tokenmtr-store = { path = "crates/tokenmtr-store" }
tokenmtr-query = { path = "crates/tokenmtr-query" }
tokenmtr-agents = { path = "crates/tokenmtr-agents" }
tokenmtr-export = { path = "crates/tokenmtr-export" }
tokenmtr-report = { path = "crates/tokenmtr-report" }
tokenmtr-remote = { path = "crates/tokenmtr-remote" }
tokenmtr-control = { path = "crates/tokenmtr-control" }
tokenmtr-platform = { path = "crates/tokenmtr-platform" }

anyhow = "1.0"
blake3 = "1.8"
camino = { version = "1.2", features = ["serde1"] }
clap = { version = "4.6", features = ["derive"] }
csv = "1.4"
globset = "0.4"
gix = { version = "0.89", default-features = false, features = ["max-performance-safe"] }
jiff = { version = "0.2", features = ["serde"] }
libc = "0.2"
memchr = "2.8"
notify = "8"
quick-xml = { version = "0.42", features = ["serialize"] }
rayon = "1.12"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
rusqlite_migration = "2.6"
rust_decimal = "1.43"
secrecy = "0.10"
security-framework = "3.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
sha2 = "0.10"
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "signal"] }
toml = "1.1"
toml_edit = "0.25"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.28", features = ["v7", "serde"] }
zstd = "0.14"

# dev
divan = "0.1"
insta = { version = "1.49", features = ["json"] }
proptest = "1.12"
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
