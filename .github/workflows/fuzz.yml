name: fuzz

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "fuzz/**"
      - "fixtures/**"
      - "crates/**"
      - "pricing/**" # embedded by tokenmtr-core
      - ".github/workflows/fuzz.yml"

jobs:
  # Stable: seeds plus truncated and bit-flipped variants through every target.
  smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: fuzz
      - name: Replay the seed corpora
        working-directory: fuzz
        run: cargo test --lib

  # Nightly: real libFuzzer, scheduled and manual runs only.
  fuzz:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-fuzz
      - name: Run every target for 60 seconds from its seed corpus
        working-directory: fuzz
        run: |
          # +nightly: rust-toolchain.toml would otherwise pin stable.
          for target in $(cargo +nightly fuzz list); do
            cargo +nightly fuzz run "$target" -- -max_total_time=60 "$PWD/seeds/$target"
          done
      - name: Keep the crashing inputs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
