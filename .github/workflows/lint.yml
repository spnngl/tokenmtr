name: lint-workflows

# actionlint and zizmor on the workflows and actions when they change; configured by
# .github/actionlint.yaml and .github/zizmor.yml.
on:
  push:
    branches:
      - main
    paths:
      - ".github/**"
  pull_request:
    paths:
      - ".github/**"

permissions: {}

jobs:
  lint:
    permissions:
      contents: read
    uses: spnngl/.github/.github/workflows/lint-workflows.yml@main
