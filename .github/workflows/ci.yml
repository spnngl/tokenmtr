name: ci

on:
  push:
    branches:
      - main
  pull_request:

# Each job grants only what it needs.
permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon (arm64). The Ubuntu image is the one the release builds
        # on, so a pull request meets the release's headers and glibc.
        os: [macos-latest, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - run: pnpm -C apps/desktop install --frozen-lockfile
      - run: pnpm -C apps/desktop run build
      # `cargo test --workspace` includes tokenmtr-desktop, whose `bindings_file_is_current`
      # test fails when apps/desktop/src/shared/bindings.ts is stale.
      # The UI checks do not depend on the OS: run them on Linux only, the cheaper runner. macOS
      # still formats, lints and tests all the Rust.
      - run: just ${{ runner.os == 'Linux' && 'check' || 'check-rust' }}

  # The one check the ruleset requires: the matrix legs are named after their OS, so requiring
  # them would break whenever the matrix changes.
  gate:
    if: always()
    needs: check
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Every check passed
        env:
          RESULT: ${{ needs.check.result }}
        run: |
          [ "$RESULT" = success ] || { echo "::error::check: $RESULT"; exit 1; }
