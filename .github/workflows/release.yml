name: release

# A `v<version>` tag builds the signed universal dmg, the debs and the rpms, then publishes one
# GitHub release with checksums, an SBOM and Sigstore signatures (docs/release.md). Nothing is
# published unless every build and check passed.
on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # origin/main, for the check below
          persist-credentials: false
      # A rebase merge rewrites the commit, so a tag made before the merge is on no branch.
      - name: Tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::the tagged commit $GITHUB_SHA is not on main: tag the commit the pull request merged"
            exit 1
          fi
      - name: Tag matches the workspace version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # `version = "..."` under [workspace.package]; reading the file spares a Rust toolchain.
          version=$(awk '/^\[/ { in_package = ($0 == "[workspace.package]") } in_package && /^version *=/ { gsub(/"/, "", $3); print $3; exit }' Cargo.toml)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match the workspace version $version (Cargo.toml)"
            exit 1
          fi
          # Both package formats order a pre-release suffix differently, so it is not supported.
          if [[ "$version" == *-* ]]; then
            echo "::error::version $version has a pre-release suffix: the deb and rpm version schemes disagree on it"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Changelog has a section for the version
        id: changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The lines between `## [<version>] - <date>` and the next `## [` heading or the link
          # definitions at the end.
          notes=$(awk -v heading="## [$VERSION]" 'index($0, heading) == 1 { found = 1; next } found && /^(## \[|\[[^]]*\]: )/ { exit } found' CHANGELOG.md)
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has no entries under ## [$VERSION]"
            exit 1
          fi
          { echo 'changelog<<CHANGELOG_EOF'; printf '%s\n' "$notes"; echo 'CHANGELOG_EOF'; } >> "$GITHUB_OUTPUT"

  macos:
    needs: version
    uses: ./.github/workflows/release-macos.yml
    permissions:
      contents: read
    # Only this build gets the signing key.
    secrets:
      MACOS_SIGNING_P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
      MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}

  linux:
    needs: version
    uses: ./.github/workflows/release-linux.yml
    permissions:
      contents: read

  # The only job that can write the release or request an OIDC token, so one identity
  # (this workflow at the tag) signs and attests every asset.
  publish:
    needs: [version, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # keyless Sigstore signing
      attestations: write # provenance and SBOM attestations
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the shortlog needs the previous tag; the SBOM reads the lockfiles
          persist-credentials: false
      # Outside the checkout, which has an assets/ directory and which the SBOM step scans.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/assets
          merge-multiple: true

      # One SBOM for every asset: they all build from the same lockfiles (.syft.yaml).
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: ${{ runner.temp }}/assets/tokenmtr_${{ env.VERSION }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # SHA256SUMS lets users check a download and lets Renovate in spnngl/homebrew-tap bump the
      # cask's sha256: `sha256sum` writes the same lines as `shasum -a 256`.
      - name: Write SHA256SUMS
        working-directory: ${{ runner.temp }}/assets
        run: |
          sha256sum -- *.dmg *.deb *.rpm *.pem *.spdx.json > SHA256SUMS
          cat SHA256SUMS
          [ "$(wc -l < SHA256SUMS)" = 7 ]

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # renovate: datasource=github-releases depName=sigstore/cosign
          cosign-release: v3.1.3
      # SHA256SUMS lists every other asset, so one signature covers them all.
      - name: Sign SHA256SUMS
        working-directory: ${{ runner.temp }}/assets
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS

      - name: Attest the build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/assets/*.dmg
            ${{ runner.temp }}/assets/*.deb
            ${{ runner.temp }}/assets/*.rpm
      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/assets/*.dmg
            ${{ runner.temp }}/assets/*.deb
            ${{ runner.temp }}/assets/*.rpm
          sbom-path: ${{ runner.temp }}/assets/tokenmtr_${{ env.VERSION }}.spdx.json

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CHANGELOG: ${{ needs.version.outputs.changelog }}
        run: |
          # SHA-256 of the DER certificate, the form `codesign --extract-certificates` lets users hash.
          fingerprint=$(openssl x509 -in "$RUNNER_TEMP/assets/tokenmtr-signing.pem" -outform der | sha256sum | cut -d' ' -f1)
          identity="https://github.com/$REPOSITORY/.github/workflows/release.yml@refs/tags/$TAG"
          previous=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          {
            printf '%s\n\n' "$CHANGELOG"
            echo "The dmg is signed with the self-signed certificate \`TokenMtr Local Signing\`, SHA-256 fingerprint \`$fingerprint\` (\`tokenmtr-signing.pem\`)."
            echo
            echo "## Verify a download"
            echo
            echo '```sh'
            echo "gh attestation verify <file> --repo $REPOSITORY"
            echo "cosign verify-blob SHA256SUMS --bundle SHA256SUMS.sigstore.json \\"
            echo "  --certificate-identity $identity \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo "sha256sum -c --ignore-missing SHA256SUMS"
            echo '```'
            echo
            echo "## Commits"
            echo
            echo '```'
            git shortlog --no-merges "${previous:+$previous..}$TAG"
            echo '```'
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --verify-tag --title "TokenMtr ${TAG#v}" \
            --notes-file "$RUNNER_TEMP/notes.md" --generate-notes "$RUNNER_TEMP"/assets/*
