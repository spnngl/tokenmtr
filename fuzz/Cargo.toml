[package]
name = "tokenmtr-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

# One target per parser of outside data (D54). Each file in `fuzz_targets/` is a one-line shim over
# the matching function in `src/lib.rs`, which `cargo test --lib` also drives on stable with the
# `seeds/` corpora (`just fuzz-smoke`).

[dependencies]
libfuzzer-sys = "0.4"
jiff = "0.2"
tokenmtr-agents = { path = "../crates/tokenmtr-agents" }
tokenmtr-config = { path = "../crates/tokenmtr-config" }
tokenmtr-core = { path = "../crates/tokenmtr-core" }
tokenmtr-metrics = { path = "../crates/tokenmtr-metrics" }
tokenmtr-remote = { path = "../crates/tokenmtr-remote" }

[[bin]]
name = "claude_line"
path = "fuzz_targets/claude_line.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pi_line"
path = "fuzz_targets/pi_line.rs"
test = false
doc = false
bench = false

[[bin]]
name = "stats_cache"
path = "fuzz_targets/stats_cache.rs"
test = false
doc = false
bench = false

[[bin]]
name = "litellm_catalog"
path = "fuzz_targets/litellm_catalog.rs"
test = false
doc = false
bench = false

[[bin]]
name = "quota_response"
path = "fuzz_targets/quota_response.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ecb_xml"
path = "fuzz_targets/ecb_xml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config"
path = "fuzz_targets/config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "accept_header"
path = "fuzz_targets/accept_header.rs"
test = false
doc = false
bench = false

[workspace]
