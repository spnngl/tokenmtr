[package]
name = "tokenmtr-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

# Targets are added next to the parser they exercise (D54): claude_line, pi_line, stats_cache,
# litellm_catalog, quota_response, ecb_xml, config.

[dependencies]
libfuzzer-sys = "0.4"
jiff = "0.2"
tokenmtr-agents = { path = "../crates/tokenmtr-agents" }
tokenmtr-core = { path = "../crates/tokenmtr-core" }
tokenmtr-remote = { path = "../crates/tokenmtr-remote" }

[[bin]]
name = "claude_line"
path = "fuzz_targets/claude_line.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pi_line"
path = "fuzz_targets/pi_line.rs"
test = false
doc = false
bench = false

[[bin]]
name = "quota_response"
path = "fuzz_targets/quota_response.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ecb_xml"
path = "fuzz_targets/ecb_xml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "litellm_catalog"
path = "fuzz_targets/litellm_catalog.rs"
test = false
doc = false
bench = false

[workspace]
